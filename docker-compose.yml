version: '3.8'

services:
  
  # Database Service (MySQL 8)
  mysql:
    image: mysql:8.0
    container_name: wfh_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-wfh_attendance_db}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASS:-apppassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  
  # Auth Service
  auth-service:
    build: ./backend/auth-service
    container_name: auth_service
    restart: always
    ports:
      - "${AUTH_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-appuser}
      - DB_PASS=${DB_PASS:-apppassword}
      - DB_NAME=${DB_NAME:-wfh_attendance_db}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_wfh_app_testing_123}
    depends_on:
      - mysql
  
  # Employee Service
  employee-service:
    build: ./backend/employee-service
    container_name: employee_service
    restart: always
    ports:
      - "${EMPLOYEE_PORT:-3002}:3002"
    environment:
      - PORT=3002
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-appuser}
      - DB_PASS=${DB_PASS:-apppassword}
      - DB_NAME=${DB_NAME:-wfh_attendance_db}
    depends_on:
      - mysql

  # Attendance Service
  attendance-service:
    build: ./backend/attendance-service
    container_name: attendance_service
    restart: always
    ports:
      - "${ATTENDANCE_PORT:-3003}:3003"
    environment:
      - PORT=3003
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-appuser}
      - DB_PASS=${DB_PASS:-apppassword}
      - DB_NAME=${DB_NAME:-wfh_attendance_db}
    depends_on:
      - mysql

  # API Gateway
  api-gateway:
    build: ./backend/api-gateway
    container_name: api_gateway
    restart: always
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:3001}
      - EMPLOYEE_SERVICE_URL=${EMPLOYEE_SERVICE_URL:-http://employee-service:3002}
      - ATTENDANCE_SERVICE_URL=${ATTENDANCE_SERVICE_URL:-http://attendance-service:3003}
    depends_on:
      - auth-service
      - employee-service
      - attendance-service

volumes:
  mysql_data: